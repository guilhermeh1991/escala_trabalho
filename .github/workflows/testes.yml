name: testes e deploy
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  motor:
    name: Motor de escala
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Instalar dependencias
        run: npm install
      - name: ESLint (analise estatica JS)
        run: npx eslint src/ testes/ || true
      - name: Suíte do motor
        run: node testes/executar.js

  api:
    name: Backend PHP
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: teste_escala
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          tools: phpstan
      - name: Conferir sintaxe PHP
        run: for f in api/*.php; do php -l "$f"; done
      - name: Analise estatica PHPStan (nivel 8)
        run: phpstan analyse --configuration=phpstan.neon --no-progress || true
      - name: Suíte da API
        run: bash testes/api.sh
      - name: Suíte do acesso individual
        run: bash testes/api-colaborador.sh

  banco:
    name: Esquema do banco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toda tabela precisa ter RLS no schema Postgres
        run: |
          python3 - <<'PY'
          import re, sys
          sql = open('banco/schema.sql').read()
          tabelas = set(re.findall(r'create table if not exists public\.(\w+)', sql))
          com_rls = set(re.findall(r'alter table public\.(\w+)\s+enable row level security', sql))
          faltando = tabelas - com_rls
          if faltando:
              sys.exit('tabelas sem RLS: ' + ', '.join(sorted(faltando)))
          print(f'{len(tabelas)} tabelas, todas com RLS')
          PY
  migracoes:
    name: Migrações MySQL legadas
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: teste_migracoes_legadas
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir cliente MySQL do runner
        run: mysql --version
      - name: Atualizar banco legado e verificar idempotência
        run: bash testes/migracoes-legadas.sh

  build:
    name: Build e sintaxe das variantes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Montar todas as variantes
        run: python3 build/montar.py
      - name: Conferir sintaxe JavaScript gerado
        run: |
          for f in dist/*.html; do
            node -e "const fs=require('fs'); const js=fs.readFileSync('$f','utf8').match(/<script>([\s\S]*)<\/script>/)[1]; new Function(js); console.log('$f: ok');"
          done
      - name: Conferir artefatos correspondentes
        run: |
          test "$(sha256sum index.html | cut -d' ' -f1)" = "$(sha256sum escala-hostgator.html | cut -d' ' -f1)"
          grep -q 'Administração da plataforma' dist/escala-hostgator.html
          grep -q 'adminCarregarSupervisores' dist/escala-hostgator.html
      - uses: actions/upload-artifact@v4
        with:
          name: variantes-geradas
          path: dist/

  browser:
    name: Painel HostGator no navegador
    needs: [api, build, migracoes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: teste_escala
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: pdo_mysql, mbstring }
      - name: Instalar Playwright fixado
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Preparar banco, dados fictícios e PHP
        run: bash testes/painel-admin-setup.sh
      - name: Gerar HostGator
        run: python3 build/montar.py
      - name: Exercitar painel real no Chromium
        timeout-minutes: 5
        env:
          BASE_URL: http://127.0.0.1:8877/escala-hostgator.html
          SCREENSHOT_DIR: artifacts/painel-admin
        run: node testes/painel-admin-browser.js
      - name: Publicar capturas e logs do navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: painel-admin-browser
          path: |
            artifacts/painel-admin/
            /tmp/painel-admin-php.log
            /tmp/shiftflow-browser-php.log
      - name: Encerrar servidor PHP e remover configuração de teste
        if: always()
        run: |
          if [ -f /tmp/shiftflow-browser-php.pid ]; then kill "$(cat /tmp/shiftflow-browser-php.pid)" || true; fi
          rm -f api/config.php

  deploy:
    name: Build e deploy para HostGator
    needs: [motor, api, banco, migracoes, build, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Montar aplicativos
        run: python3 build/montar.py
      - name: Preparar pasta da API para deploy
        run: |
          mkdir -p deploy/api
          cp api/comum.php api/auth.php api/dados.php api/minha.php api/.htaccess deploy/api/
      - name: Preparar HTML final como index.html
        run: cp dist/escala-hostgator.html dist/index.html
      - name: Enviar HTML para a HostGator via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.HG_HOST }}
          username: ${{ secrets.HG_USER }}
          ssh_private_key: ${{ secrets.HG_SSH_KEY }}
          ssh_passphrase: ${{ secrets.HG_SSH_PASSPHRASE }}
          port: 2222
          local_path: 'dist/index.html'
          remote_path: ${{ secrets.HG_PATH }}
          sftp_only: true
      - name: Enviar API para a HostGator via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.HG_HOST }}
          username: ${{ secrets.HG_USER }}
          ssh_private_key: ${{ secrets.HG_SSH_KEY }}
          ssh_passphrase: ${{ secrets.HG_SSH_PASSPHRASE }}
          port: 2222
          local_path: 'deploy/api'
          remote_path: ${{ secrets.HG_PATH }}
          sftp_only: true
      - uses: actions/upload-artifact@v4
        with:
          name: aplicativos
          path: dist/
          retention-days: 30
